[project]
name = "tars-rl"
version = "0.1.0"
description = "TARS from Interstellar in simulation, trained with reinforcement learning."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "brax>=0.12",
    "jax>=0.4.30,<0.9",
    "mujoco>=3.2.0",
    "mujoco-mjx>=3.2.0",
    "numpy>=1.26",
    "playground>=0.0.5",
]

[project.optional-dependencies]
cuda = ["jax[cuda12]>=0.4.30"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tars_rl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
