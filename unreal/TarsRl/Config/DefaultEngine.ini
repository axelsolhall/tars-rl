[/Script/EngineSettings.GameMapsSettings]
; Engine template map with a floor, sun and sky; TarsGameMode spawns TARS on its floor.
EditorStartupMap=/Engine/Maps/Templates/Template_Default.Template_Default
GameDefaultMap=/Engine/Maps/Templates/Template_Default.Template_Default
GlobalDefaultGameMode=/Script/TarsRl.TarsGameMode

[/Script/Engine.PhysicsSettings]
; No substeps: TarsGameMode fixes every frame at one 2 ms physics step, MuJoCo's timestep in the
; BodySpec (A71), so TARS's servos (ATarsActor::ServoStep) act before each step like MuJoCo's.
bSubstepping=False
DefaultGravityZ=-981.000000
; Sharp boxes: Chaos otherwise shrinks every box by 5 % of its size and rounds the edges back on,
; which shortens TARS's 9 cm feet by ~4.5 mm a side (MuJoCo's boxes are sharp). Iterations are
; the defaults: 32/8 and 64/32 changed none of the contact probes (2026-11-04); friction now runs in
; all of them, see [SystemSettings].
SolverOptions=(PositionIterations=8,VelocityIterations=2,ProjectionIterations=1,CollisionMarginFraction=0.0,CollisionMarginMax=0.0,CollisionCullDistance=3.0)

[SystemSettings]
; Friction in all 8 position iterations, not Chaos's default first 4. With 4, TARS's arm feet slid
; back 2 cm while the hinges swung (MuJoCo and Bullet hold them still) and TARS slowly fell over
; backwards; with 8 it rocks forward and settles like the other engines (2026-11-04, the hinges
; probe of tars_rl.unreal.probe). Shock propagation, static friction stiffness and velocity
; friction iterations changed nothing.
p.Chaos.Solver.Collision.PositionFrictionIterations=8
